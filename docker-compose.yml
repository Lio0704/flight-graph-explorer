name: flight-graph

services:
  # 1. Graph database (official image + Graph Data Science plugin)
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512M
      # Healthcheck credentials. Deliberately NOT prefixed with NEO4J_: the image
      # turns every NEO4J_* variable into a config setting and rejects unknown ones.
      HC_USER: ${NEO4J_USER:-neo4j}
      HC_PASSWORD: ${NEO4J_PASSWORD}
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$$HC_USER\" -p \"$$HC_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # 2. One-shot job: ingest OpenFlights, run GDS analytics, train link predictor
  seeder:
    build: .
    env_file: .env
    command: ["sh", "-c", "python -m scripts.seed_data --if-empty && python -m scripts.run_gds && python -m scripts.train_link_predictor"]
    volumes:
      - models:/srv/models
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  # 3. FastAPI service
  api:
    build: .
    image: ${IMAGE_NAME:-flight-graph-api}:latest
    env_file: .env
    volumes:
      - models:/srv/models
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  # 4. Reverse proxy (rate limiting on the LLM endpoint, single public port)
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  # 5. Optional local LLM: `docker compose --profile ollama up`
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  neo4j_data:
  models:
  ollama_models:
