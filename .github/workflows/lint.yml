name: lint

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pylint (fails under 9.5)
        run: pylint app scripts tests --fail-under=9.5
