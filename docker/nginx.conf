# Reverse proxy in front of FastAPI.
# - single public entry point (:80), the API container is not needed on the host
# - stricter rate limit on the LLM endpoint (each call costs tokens / GPU time)

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_agent:10m rate=6r/m;

# Resolve the API through Docker's DNS at request time (not once at startup),
# so recreating the api container does not leave nginx pointing at a dead IP (502).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    set $fastapi http://api:8000;

    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /api/agent/ {
        limit_req zone=api_agent burst=3 nodelay;
        limit_req_status 429;
        proxy_read_timeout 120s;
        proxy_pass $fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass $fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
